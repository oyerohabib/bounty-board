<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Bounty Board">
  <!-- plaque -->
  <rect x="8" y="10" width="112" height="108" rx="22" fill="#F3EFE6" stroke="#1C1917" stroke-width="5"/>

  <!-- note -->
  <rect x="36" y="40" width="56" height="58" rx="5" fill="#FFFDF8" stroke="#1C1917" stroke-width="3.5"/>

  <!-- coin -->
  <circle cx="64" cy="72" r="19" fill="#115E59"/>
  <circle cx="64" cy="72" r="19" fill="none" stroke="#C4A35A" stroke-width="3.5"/>
  <circle cx="64" cy="72" r="19" fill="none" stroke="#1C1917" stroke-width="1.75"/>

  <!--
    Solana-style bars, centered on (64,72).
    Each parallelogram: width 18, height 4.6, slant 3.6
    Visual center x = left + width/2 - slant/2 = left + 7.2 → left = 56.8
    Vertical stack: 4.6*3 + gap 2.2*2 = 18.2 → top = 72 - 9.1 = 62.9
  -->
  <path fill="#5EEAD4" d="M56.8 62.9h18l-3.6 4.6H53.2z"/>
  <path fill="#99F6E4" d="M56.8 69.7h18l-3.6 4.6H53.2z"/>
  <path fill="#5EEAD4" d="M56.8 76.5h18l-3.6 4.6H53.2z"/>

  <!-- pin -->
  <circle cx="64" cy="30" r="9" fill="#115E59" stroke="#1C1917" stroke-width="3.5"/>
  <circle cx="64" cy="30" r="3" fill="#F3EFE6"/>
  <path d="M64 39.5V48" stroke="#1C1917" stroke-width="3.5" stroke-linecap="round"/>
</svg>
